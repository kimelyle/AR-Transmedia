<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <!-- Import the <model-viewer> web component -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h1>View my 3D Model in AR</h1>
    <!-- The model-viewer element with AR attributes -->
    <model-viewer
        src="model.glb"
        ios-src="model.usdz"
        alt="A 3D model of your object"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
    ></model-viewer>
</body>
</html>
