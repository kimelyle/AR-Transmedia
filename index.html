<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student AR Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #eee;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <model-viewer 
      src="model.glb"
      ios-src="model.usdz"
      alt="3D Model"
      ar
      ar-modes="scene-viewer quick-look"
      camera-controls
      auto-rotate
      animation-name="YourAnimationName"
      autoplay
      background-color="#FFFFFF">
  </model-viewer>
</body>
</html>
