<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Quick Look Link</title>
</head>
<body>
    <h1>Tap below to view model in AR</h1>
    <!-- The hyperlink with the 'rel="ar"' attribute and a required 'img' tag -->
    <a rel="ar" href="model.usdz">
        <img src="model.png" alt="Tap here to view 3D model">
    </a>
</body>
</html>
