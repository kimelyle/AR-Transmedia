<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student AR Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eee;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Move AR button to top-right */
    model-viewer::part(ar-button) {
      bottom: auto;
      top: 10px;
      right: 10px;
    }
  </style>
</head>
<body>
  <model-viewer 
      src="model.glb"          <!-- Android/desktop GLB -->
      ios-src="model.usdz"     <!-- iOS Quick Look -->
      alt="3D Model"
      ar
      ar-modes="scene-viewer quick-look"
      camera-controls
      auto-rotate
      autoplay
      background-color="#FFFFFF">
  </model-viewer>
</body>
</html>
